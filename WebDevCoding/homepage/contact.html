<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <link href="styles.css" rel="stylesheet">
    <title>Contact</title>
</head>
<body>
    <header>
      <h1 class="logo">Keshav Kumar</h1>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="hobby.html">Hobby</a>
            <a href="contact.html">Contact</a>
            <a href="projects.html">Projects</a>
        </nav>
        <button id="darkModeToggle" class="btn btn-sm btn-outline-dark">Dark Mode</button>
    </header>

    <main class="container mt-4" style="max-width: 40rem;">
        <h2 class="text-center mb-4">Contact Me</h2>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Get in Touch</h5>
                <p class="card-text">Have a question or just want to say hi? Fill out the form below!</p>

                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Your name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="your@email.com">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Write your message here..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submitBtn">Send Message</button>
                </form>
            </div>
        </div>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Other Ways to Reach Me</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">Email: keshav@example.com</li>
                    <li class="list-group-item">GitHub: github.com/keshavk</li>
                    <li class="list-group-item">LinkedIn: linkedin.com/in/keshavk</li>
                </ul>
            </div>
        </div>

        <div class="text-center mb-4">
            <a href="index.html" class="btn btn-outline-secondary">Back to Home</a>
        </div>
    </main>

    <footer class="text-center mt-5 p-3 bg-light">
        <p class="mb-0">&copy; 2026 Keshav Kumar</p>
    </footer>
</body>
</html>
