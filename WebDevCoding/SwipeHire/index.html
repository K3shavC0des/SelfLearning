<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwipeHire</title>

    <style>
        body {
            background-color: beige;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            display: flex;
            justify-content: space-around;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: large;
            background-color: cornflowerblue;
        }

        .resumeCard {
            max-width: 500px;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            background-color: darkgray;
            text-align: center;
        }

        .buttonRow {
            display: flex;
            justify-content: center;
            margin: 15px;
            padding: 15px;
            gap: 10px;
        }

        button {
            padding: 15px;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
        }

        ul {
            list-style: none;
            padding: 0;
        }
    </style>

    <script>
        let CurrentResume = 0;
        let goodResumes = 0;
        let badResumes = 0;

        const resumes = [
            {
                name: "Alex Chen",
                role: "Backend Intern Applicant",
                bullets: [
                    "Built REST API in Flask serving 1k req/day",
                    "Reduced query latency 40% via PostgreSQL indexing",
                    "Shipped JWT auth and CI/CD on Render"
                ],
                skills: ["Python", "Flask", "PostgreSQL", "Docker"]
            },
            {
                name: "Sarah Johnson",
                role: "Frontend Intern Applicant",
                bullets: [
                    "Built responsive websites with HTML, CSS, JavaScript",
                    "Improved page load speed by 35%",
                    "Developed reusable React components"
                ],
                skills: ["HTML", "CSS", "JavaScript", "React"]
            },
            {
                name: "Michael Patel",
                role: "ML Intern Applicant",
                bullets: [
                    "Trained image classification model (94% accuracy)",
                    "Cleaned dataset with Pandas",
                    "Visualized results using Matplotlib"
                ],
                skills: ["Python", "Pandas", "Scikit-learn", "Matplotlib"]
            }
        ];

        function updateStats() {
            document.getElementById("goodCount").textContent = goodResumes;
            document.getElementById("badCount").textContent = badResumes;
            document.getElementById("remainingCount").textContent =
                resumes.length - CurrentResume;
        }

        function renderResume(index) {
            const display = document.querySelector(".resumeCard");

            if (index >= resumes.length) {
                display.innerHTML = `
                    <h2>No more resumes!</h2>
                    <p>Interviewed: ${goodResumes}</p>
                    <p>Rejected: ${badResumes}</p>
                    <button id="resetBtn">Reset</button>
                `;

                document.getElementById("resetBtn").addEventListener("click", () => {
                    CurrentResume = 0;
                    goodResumes = 0;
                    badResumes = 0;
                    renderResume(CurrentResume);
                    updateStats();
                });

                return;
            }

            const resume = resumes[index];

            display.innerHTML = `
                <div class="personDetails">
                    <h3>${resume.name} — ${resume.role}</h3>
                </div>

                <div class="bulletPoints">
                    <ul>
                        ${resume.bullets.map(b => `<li>${b}</li>`).join("")}
                    </ul>
                </div>

                <div class="skills">
                    <p>Skills: ${resume.skills.join(", ")}</p>
                </div>
            `;

            updateStats();
        }

        function next() {
            CurrentResume++;
            renderResume(CurrentResume);
        }

        function back() {
            if (CurrentResume > 0) {
                CurrentResume--;
                renderResume(CurrentResume);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelector(".interview").addEventListener("click", () => {
                goodResumes++;
                next();
            });

            document.querySelector(".trash").addEventListener("click", () => {
                badResumes++;
                next();
            });

            document.querySelector(".back").addEventListener("click", back);
            document.querySelector(".next").addEventListener("click", next);

            renderResume(0);
        });
    </script>
</head>

<body>

    <header>
        <h1>Keshav Kumar</h1>
        <h1>SwipeHire</h1>
    </header>

    <main>

        <div class="stats">
            <p>
                Interviewed: <span id="goodCount">0</span> |
                Rejected: <span id="badCount">0</span> |
                Remaining: <span id="remainingCount">0</span>
            </p>
        </div>

        <div class="resumeCard"></div>

        <div class="buttonRow">
            <button class="interview">Interview</button>
            <button class="trash">Trash</button>
        </div>

        <div class="buttonRow">
            <button class="back">Back</button>
            <button class="next">Next</button>
        </div>

    </main>

</body>
</html>
